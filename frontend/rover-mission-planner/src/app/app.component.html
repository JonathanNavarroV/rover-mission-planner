<div class="container">
  <h1>📅 Planificador de Tareas para Rovers</h1>

  <div class="form">
    <label for="roverId">ID del Rover:</label>
    <input id="roverId" type="text" [(ngModel)]="roverId" />

    <label for="date">Fecha:</label>
    <input id="date" type="date" [(ngModel)]="selectedDate" />

    <button (click)="loadTimeline()">Buscar</button>
  </div>

  <hr />

  <app-timeline
    *ngIf="searchParams"
    [roverId]="searchParams.roverId"
    [date]="searchParams.date"
  />
</div>
